name: Oracle Cloud Auto Provisioner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  apply-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          EOF

      - name: Run Auto Apply Loop
        run: |
          STACK_ID="${{ secrets.OCI_STACK_ID }}"
          echo "🚀 Memulai percobaan auto-apply via GitHub Actions..."

          END_TIME=$(($(date +%s) + 600))

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "--------------------------------------------------"
            echo "⏱️ [$(date '+%Y-%m-%d %H:%M:%S')] Mengirim job apply baru..."

            # Ambil Job ID secara langsung menggunakan filter bawaan OCI
            JOB_ID=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy "AUTO_APPROVED" \
              --query "data.id" \
              --raw-output 2>&1 || true)

            # Cek apakah JOB_ID valid (diawali dengan ocid1.ormjob)
            if [[ "$JOB_ID" == ocid1.ormjob* ]]; then
              echo "✅ Job diterima OCI (ID: $JOB_ID). Menunggu proses eksekusi (45 detik)..."
              sleep 45

              # Cek status akhir Job
              JOB_STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>&1 || echo "UNKNOWN")
              echo "📌 Status Akhir Job di Oracle: $JOB_STATUS"

              if [ "$JOB_STATUS" == "SUCCEEDED" ]; then
                echo "🎉 SELESAI! Server berhasil dibuat!"
                exit 0
              else
                echo "📋 --- PESAN EROR DARI ORACLE ---"
                oci resource-manager job get-job-logs-content --job-id "$JOB_ID" --file - 2>&1 | tail -n 12 || echo "Gagal mengambil log."
                echo "---------------------------------"
              fi
            else
              echo "⚠️ Gagal/Respon langsung OCI:"
              echo "$JOB_ID"
            fi

            echo "🔄 Percobaan berikutnya dalam 1 menit..."
            sleep 60
          done
