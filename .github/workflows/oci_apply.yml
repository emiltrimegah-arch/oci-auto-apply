name: Oracle Cloud Auto Provisioner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  # Mengambil nilai dari Repository Variable di Settings (jika kosong, otomatis default ke 2)
  INTERVAL_MINUTES: ${{ vars.INTERVAL_MINUTES || '2' }}
  SUPPRESS_LABEL_WARNING: "True"
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  apply-oci:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          EOF

          chmod 600 ~/.oci/config

      - name: Run Auto Apply Loop
        run: |
          STACK_ID="${{ secrets.OCI_STACK_ID }}"
          SLEEP_SECONDS=$((INTERVAL_MINUTES * 60))

          echo "🚀 Memulai auto-apply (Set jeda: ${INTERVAL_MINUTES} menit dari Variables)..."

          END_TIME=$(($(date +%s) + 600))

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "--------------------------------------------------"
            echo "⏱️ [$(date '+%Y-%m-%d %H:%M:%S')] Mengirim job apply baru..."

            RAW_OUTPUT=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy "AUTO_APPROVED" \
              --query "data.id" \
              --raw-output 2>&1 || true)

            JOB_ID=$(echo "$RAW_OUTPUT" | grep -o 'ocid1\.ormjob\.[^[:space:]"]*' | head -n 1)

            if [ -n "$JOB_ID" ]; then
              echo "✅ Job diterima OCI (ID: $JOB_ID). Menunggu proses eksekusi (45 detik)..."
              sleep 45

              JOB_STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>&1 | grep -v "WARNING" | xargs || echo "UNKNOWN")
              echo "📌 Status Akhir Job di Oracle: $JOB_STATUS"

              if [ "$JOB_STATUS" == "SUCCEEDED" ]; then
                echo "🎉 SELESAI! Server berhasil dibuat!"
                exit 0
              else
                echo "📋 --- PESAN EROR DARI ORACLE ---"
                oci resource-manager job get-job-logs-content --job-id "$JOB_ID" --file - 2>&1 | tail -n 12 || echo "Gagal mengambil log."
                echo "---------------------------------"
              fi
            elif echo "$RAW_OUTPUT" | grep -q "TooManyRequests"; then
              echo "⚠️ Kena Rate Limit (TooManyRequests). Istirahat sebentar agar API Oracle adem..."
            else
              echo "⚠️ Respon langsung OCI:"
              echo "$RAW_OUTPUT"
            fi

            echo "🔄 Istirahat ${INTERVAL_MINUTES} menit (${SLEEP_SECONDS} detik) sebelum percobaan berikutnya..."
            sleep $SLEEP_SECONDS
          done
