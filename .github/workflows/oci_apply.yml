name: Oracle Cloud Auto Provisioner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  apply-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI & jq
        run: |
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          EOF

      - name: Run Auto Apply Loop
        run: |
          STACK_ID="${{ secrets.OCI_STACK_ID }}"
          echo "🚀 Memulai percobaan auto-apply via GitHub Actions..."

          END_TIME=$(($(date +%s) + 600))

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "--------------------------------------------------"
            echo "⏱️ [$(date '+%Y-%m-%d %H:%M:%S')] Mengirim job apply baru..."

            JOB_OUTPUT=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy "AUTO_APPROVED" \
              --output json 2>&1)

            JOB_ID=$(echo "$JOB_OUTPUT" | jq -r '.data.id // empty')

            if [ -n "$JOB_ID" ]; then
              echo "✅ Job diterima OCI (ID: $JOB_ID). Menunggu proses eksekusi (45 detik)..."
              sleep 45

              # Cek status akhir Job
              JOB_STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>&1)
              echo "📌 Status Akhir Job di Oracle: $JOB_STATUS"

              if [ "$JOB_STATUS" == "SUCCEEDED" ]; then
                echo "🎉 SELESAI! Server berhasil dibuat!"
                exit 0
              else
                echo "📋 --- PESAN EROR DARI ORACLE ---"
                # Ambil dan cetak 12 baris terakhir dari log resmi Oracle
                oci resource-manager job get-job-logs-content --job-id "$JOB_ID" --file - 2>&1 | tail -n 12
                echo "---------------------------------"
              fi
            else
              echo "⚠️ Gagal membuat job request: $JOB_OUTPUT"
            fi

            echo "🔄 Percobaan berikutnya dalam 1 menit..."
            sleep 60
          done
