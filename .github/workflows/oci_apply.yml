name: Oracle Cloud Auto Provisioner

on:
  schedule:
    # Berjalan otomatis setiap 15 menit
    - cron: '*/15 * * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual

jobs:
  apply-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          EOF

      - name: Run Auto Apply Loop
        run: |
          STACK_ID="${{ secrets.OCI_STACK_ID }}"
          echo "🚀 Memulai percobaan auto-apply via GitHub Actions..."

          # Jalan berulang-ulang selama 10 menit di dalam runner ini
          END_TIME=$(($(date +%s) + 600))

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "--------------------------------------------------"
            echo "⏱️ [$(date '+%Y-%m-%d %H:%M:%S')] Mengirim job apply baru..."

            JOB_OUTPUT=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy "AUTO_APPROVED" \
              --output json 2>&1)

            if echo "$JOB_OUTPUT" | grep -q '"lifecycle-state": "ACCEPTED"'; then
              echo "✅ Job berhasil dikirim ke OCI. Menunggu 30 detik..."
              sleep 30
            else
              echo "⚠️ Gagal/Respon OCI: $JOB_OUTPUT"
            fi

            echo "🔄 Percobaan berikutnya dalam 2 menit..."
            sleep 120
          done
