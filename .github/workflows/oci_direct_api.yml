name: Oracle Cloud Auto Provisioner (Direct API)

on:
  schedule:
    # Berjalan agresif setiap 2 menit (Bebas TooManyRequests)
    - cron: '*/2 * * * *'
  workflow_dispatch:

env:
  SUPPRESS_LABEL_WARNING: "True"
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  launch-instance:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY }}
          region=ap-singapore-2
          EOF

          chmod 600 ~/.oci/config

      - name: Direct API Instance Launch
        run: |
          echo "🚀 [$(date '+%Y-%m-%d %H:%M:%S')] Mengirim request pembuatan instance via Direct API..."

          # Menyiapkan file Public Key SSH
          cat <<'EOF' > ~/.oci/id_rsa.pub
          ssh-rsa  emilia.khouw@trimegah.com
          EOF

          RAW_OUTPUT=$(oci compute instance launch \
            --compartment-id "ocid1.tenancy.oc1..aaaaaaaatv23g2vqcmzwfsqhzeq7kc7gk2ht3whgi6mvzctjgvqdq3bg56ra" \
            --availability-domain "imzS:AP-SINGAPORE-2-AD-1" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memory_in_gbs":24}' \
            --display-name "instance-ARM-4Core-24GB" \
            --image-id "ocid1.image.oc1.ap-singapore-2.aaaaaaaavqsvyxvzsvgonjp6bydc5xdyo2ailv7sxlzjvbnbrh3mtepdujyq" \
            --subnet-id "ocid1.subnet.oc1.ap-singapore-2.aaaaaaaa6cmiefetmrnd3j72l3pgxrfbf4vjwnw3yefh5vjgsjyvwow3ckua" \
            --ssh-authorized-keys-file ~/.oci/id_rsa.pub \
            --assign-public-ip true \
            2>&1 || true)

          if echo "$RAW_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "🎉 SELESAI! Server BERHASIL dibuat dan sedang dinyalakan oleh Oracle!"
            exit 0
          elif echo "$RAW_OUTPUT" | grep -q -i "Out of capacity"; then
            echo "📌 Status Akhir: Out of capacity (Kapasitas ARM masih penuh). Otomatis coba lagi 2 menit lagi..."
          else
            echo "📋 Respon dari Oracle:"
            echo "$RAW_OUTPUT"
          fi
